name: tollgate
description: >-
  One purchase API over Google Play, the App Store and Stripe, backed by your
  own Supabase project.
version: 0.1.0
repository: https://github.com/enzo/tollgate
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # The official plugin. Its Android side wraps Play Billing 8, which Google
  # requires for all app updates from 31 August 2026, and its iOS side uses
  # StoreKit 2. Chosen over the alternatives because the billing library version
  # is the thing most likely to force an emergency update, and this is the
  # package that tracks it fastest.
  in_app_purchase: ^3.3.0

  # Needed directly for the Android-only purchase parameters: the obfuscated
  # account id has no cross-platform equivalent on PurchaseParam, and it is the
  # only thing that ties a Play purchase back to a user.
  in_app_purchase_android: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
