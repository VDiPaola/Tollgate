# Everything that can be checked without a store account or a device.
#
# Deliberately not here: `deno fmt --check`. The prose in this repository is
# hand-wrapped and the formatter reflows Markdown tables and paragraphs, so
# enforcing it would mean choosing between a formatter's line breaks and
# readable documentation. `deno lint` is enforced, because it finds bugs.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check every package
        run: deno task check

      - name: Lint
        run: deno lint

      # openssl is present on the runner. The certificate and JWS tests build a
      # chain they hold every key to, which is the only way to test that a
      # forged one is refused. Those cases are skipped on machines without it,
      # so keeping it available here gives CI the complete suite.
      - name: Unit tests
        run: deno task test

      # Docker is present on ubuntu runners, and the test file creates and
      # destroys its own throwaway Postgres. Bare postgres rather than a
      # Supabase stack, which is what proves the pack needs only auth.users,
      # auth.uid() and the three roles.
      - name: SQL pack
        run: deno task test:db

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/flutter
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
